name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen # the runners have no display

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Libraries Qt needs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: uv sync --python ${{ matrix.python }}

      # Includes starting yt-dlp, ffmpeg and Deno once each, and writing this system's launcher.
      - name: Tests
        run: uv run pytest -v

      - name: Self-check from the command line
        run: uv run python -m ytgrab --check
